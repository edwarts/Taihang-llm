### ====================================================================
### Qwen3-32B LoRA 微调配置
### 硬件: AMD AI Max 395+ 128GB 统一内存 / WSL2 + ROCm
### 路径: WSL2 挂载 /mnt/c/code-base/Taihang-llm/
### ====================================================================

### Model
model_name_or_path: Qwen/Qwen3-32B
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

### Dataset
dataset: trading_reasoning
dataset_dir: /mnt/c/code-base/Taihang-llm/finetune
template: qwen3
cutoff_len: 8192
max_samples: 200
overwrite_cache: true
preprocessing_num_workers: 8

### Output (WSL2 绝对路径)
output_dir: /mnt/c/code-base/Taihang-llm/outputs/qwen3_32b_lora_n200_lr3e5_20260209_195333
logging_steps: 5
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true

### Train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 3e-5
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
gradient_checkpointing: true

### Eval
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200

### Optimization
optim: adamw_torch
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
max_grad_norm: 1.0

### Wandb
report_to: wandb
run_name: lora_n200_lr3e5_20260209_195333
